<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ELSI Certificate Verification</title>
<style>
  body{font-family:'Segoe UI',sans-serif;background: linear-gradient(135deg,#0f172a,#1e293b);min-height:100vh;display:flex;align-items:center;justify-content:center;margin:0;padding:20px}
 .card{background:#fff;border-radius:20px;max-width:480px;width:100%;padding:30px;box-shadow:0 20px 60px rgba(0,0,0,0.4);text-align:center;animation:pop 0.6s ease}
  @keyframes pop{0%{transform:scale(0.8);opacity:0}100%{transform:scale(1);opacity:1}}
 .logo{font-weight:800;color:#0f172a;letter-spacing:1px;font-size:14px}
 .badge{ background:#dcfce7;color:#166534;padding:6px 14px;border-radius:20px;font-size:13px;font-weight:600;display:inline-block;margin:10px 0}
 .name{font-size:28px;font-weight:800;color:#0f172a;margin:15px 0 5px}
 .details{text-align:left;background:#f8fafc;border-radius:12px;padding:18px;margin:20px 0}
 .details p{margin:8px 0;font-size:14px;display:flex;justify-content:space-between}
 .footer{font-size:12px;color:#94a3b8;margin-top:15px}
 .btn{display:inline-block;margin:8px 5px;padding:10px 18px;border-radius:10px;text-decoration:none;font-weight:600;font-size:14px}
 .btn-whatsapp{background:#25D366;color:#fff}
</style>
</head>
<body>
<div class="card">
  <div class="logo">ELSI - ELEVATE LEARNING & SKILLS INSTITUTE</div>
  <div style="font-size:40px;margin-top:10px">🎉</div>
  <h2 id="heading">Verifying...</h2>
  <div id="content"></div>
</div>
<script>
const certificates = [
  {
    id: "ELSI-2026-001",
    name: "Nabeel Lakhair",
    father: "Abdul Khalique Lakhair",
    cnic: "41205-1891856-1",
    contact: "0316-3415406",
    course: "Website Development",
    duration: "3-Months",
    start: "7/10/2026",
    end: "10/9/2026",
    issue: "10/15/2026",
    grade: "A+",
    status: "Completed"
  }
];

const certId = new URLSearchParams(window.location.search).get("id");
const found = certificates.find(c => c.id === certId);

if(found){
  document.getElementById("heading").innerHTML = `Congratulations ${found.name}! 🎉`;
  document.getElementById("content").innerHTML = `
    <div class="badge">✅ Verified & Proud Student of ELSI</div>
    <div class="name">${found.name}</div>
    <div style="color:#475569">S/O ${found.father}</div>
    <div class="details">
      <p><b>Certificate ID:</b> <span>${found.id}</span></p>
      <p><b>CNIC No:</b> <span>${found.cnic}</span></p>
      <p><b>Contact:</b> <span>${found.contact}</span></p>
      <p><b>Course:</b> <span>${found.course}</span></p>
      <p><b>Duration:</b> <span>${found.duration}</span></p>
      <p><b>Grade:</b> <span>${found.grade}</span></p>
      <p><b>Issue Date:</b> <span>${found.issue}</span></p>
      <p><b>Status:</b> <span style="color:#16a34a;font-weight:bold">${found.status}</span></p>
    </div>
    <p style="font-size:14px;color:#334155">We are proud of your hard work. Keep shining!<br><b>May Allah bless you with a bright and sucessful future.</b></p>
    <a class="btn btn-whatsapp" href="https://wa.me/?text=I completed ${found.course} from ELSI! Verify: ${window.location.href}" target="_blank">Share on WhatsApp</a>
    <div class="footer">Verified by ELSI - Powered by Sir Nabeel Lakhair</div>
  `;
} else {
  document.getElementById("heading").innerHTML = "Certificate Not Found ❌";
  document.getElementById("content").innerHTML = `<p>ID <b>${certId || 'No ID'}</b> ka record nahi mila.<br>Try: ?id=ELSI-2026-001</p>`;
}
</script>
</body>
</html>
